<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raspadinha - Alice</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(180deg, #fffaf8, #f9f4f1);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    color: #665d5a;
}

.container {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    padding: 28px 18px 35px;
    text-align: center;
    position: relative;
}

/* desenhos decorativos */
.decor {
    position: absolute;
    font-size: 28px;
    opacity: 0.22;
    user-select: none;
    pointer-events: none;
}

.decor1 { top: 30px; left: 18px; }
.decor2 { top: 115px; right: 18px; }
.decor3 { top: 310px; left: 10px; }
.decor4 { top: 410px; right: 12px; }
.decor5 { bottom: 90px; left: 20px; }
.decor6 { bottom: 45px; right: 20px; }

h1 {
    margin: 10px 0 8px;
    font-size: 25px;
    font-weight: normal;
    color: #776b67;
}

.subtitle {
    font-size: 17px;
    line-height: 1.5;
    margin: 0 auto 25px;
    max-width: 350px;
}

.subtitle strong {
    font-weight: normal;
    color: #9c8880;
}

.instructions {
    font-size: 14px;
    color: #a49792;
    margin-bottom: 18px;
}

/* grade */
.game {
    width: min(88vw, 350px);
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

/* cada quadrado */
.card {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    overflow: hidden;
    background: #fff;
    box-shadow:
        0 5px 15px rgba(100, 80, 70, 0.10),
        inset 0 0 0 1px rgba(170, 140, 125, 0.15);
}

/* imagem escondida */
.symbol {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 43px;
    background: #fffdfb;
}

/* canvas da raspadinha */
canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: pointer;
}

/* mensagem final */
.reveal {
    display: none;
    margin-top: 25px;
    padding: 25px 18px;
    border-radius: 22px;
    background: rgba(255,255,255,0.88);
    box-shadow: 0 8px 25px rgba(120, 90, 80, 0.13);
    animation: aparecer 1.2s ease forwards;
}

.reveal.show {
    display: block;
}

.reveal .small {
    font-size: 18px;
    color: #8d7c77;
}

.reveal h2 {
    margin: 8px 0;
    font-size: 40px;
    font-weight: normal;
    letter-spacing: 4px;
    color: #d895a7;
}

.reveal p {
    margin: 0;
    font-size: 17px;
    line-height: 1.5;
}

.heart {
    font-size: 30px;
    margin-top: 10px;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* confetes */
.confetti {
    position: fixed;
    top: -20px;
    pointer-events: none;
    z-index: 50;
    animation: cair linear forwards;
}

@keyframes cair {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

@media (max-width: 360px) {
    .game {
        width: 92vw;
        gap: 8px;
    }

    h1 {
        font-size: 22px;
    }

    .subtitle {
        font-size: 15px;
    }

    .symbol {
        font-size: 36px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- desenhos decorativos -->
    <div class="decor decor1">🧸</div>
    <div class="decor decor2">🎀</div>
    <div class="decor decor3">🍼</div>
    <div class="decor decor4">🧢</div>
    <div class="decor decor5">☁️</div>
    <div class="decor decor6">⭐</div>

    <h1>Nossa família está crescendo 💕</h1>

    <div class="subtitle">
        E queremos compartilhar com você
        <br>
        se virá <strong>Mateus ou Alice</strong>...
    </div>

    <div class="instructions">
        Raspe os quadrinhos e descubra a surpresa ✨
    </div>

    <div class="game" id="game"></div>

    <div class="reveal" id="reveal">
        <div class="small">A nossa maior surpresa é...</div>

        <h2>ALICE</h2>

        <p>
            É MENINA! 🎀<br>
            Nossa pequena está chegando!
        </p>

        <div class="heart">🩷</div>
    </div>

</div>

<script>

/*
====================================================
 CONFIGURAÇÃO DO JOGO
====================================================

A grade possui 9 quadrinhos.

A sequência vencedora será SEMPRE:
posição 2
posição 5
posição 8

Ou seja:

💙   🩷   💙
🩷   🩷   💙
💙   🩷   🩷

A coluna do meio possui as 3 rosas.

Não existe nenhuma sequência de 3 azuis.
====================================================
*/

const simbolos = [

    "💙", "🩷", "💙",

    "🩷", "🩷", "💙",

    "💙", "🩷", "🩷"

];

const game = document.getElementById("game");
const reveal = document.getElementById("reveal");

let raspados = 0;
let revelado = false;

/*
Posições que formam a sequência rosa vencedora.
*/

const vencedoras = [1, 4, 7];

const cards = [];

/*
Criar os 9 quadrinhos
*/

simbolos.forEach((simbolo, index) => {

    const card = document.createElement("div");
    card.className = "card";

    const symbol = document.createElement("div");
    symbol.className = "symbol";
    symbol.textContent = simbolo;

    const canvas = document.createElement("canvas");

    card.appendChild(symbol);
    card.appendChild(canvas);
    game.appendChild(card);

    cards.push({
        card,
        canvas,
        symbol,
        raspado: false
    });

    prepararRaspadinha(canvas, index);

});


/*
====================================================
FUNÇÃO DA RASPADINHA
====================================================
*/

function prepararRaspadinha(canvas, index) {

    const ctx = canvas.getContext("2d");

    function ajustarCanvas() {

        const rect = canvas.getBoundingClientRect();

        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;

        ctx.scale(
            window.devicePixelRatio,
            window.devicePixelRatio
        );

        const largura = rect.width;
        const altura = rect.height;

        /*
        Fundo dourado elegante
        */

        const gradiente = ctx.createLinearGradient(
            0,
            0,
            largura,
            altura
        );

        gradiente.addColorStop(0, "#d8c29b");
        gradiente.addColorStop(0.5, "#c8ad7b");
        gradiente.addColorStop(1, "#e1cda9");

        ctx.fillStyle = gradiente;
        ctx.fillRect(0, 0, largura, altura);

        /*
        Pequenos brilhos
        */

        ctx.fillStyle = "rgba(255,255,255,0.25)";

        for (let i = 0; i < 25; i++) {

            const x = Math.random() * largura;
            const y = Math.random() * altura;
            const r = Math.random() * 2 + 0.5;

            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }

        /*
        Texto da raspadinha
        */

        ctx.fillStyle = "rgba(255,255,255,0.92)";
        ctx.font = "16px Georgia";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
            "raspe aqui ✨",
            largura / 2,
            altura / 2
        );
    }

    ajustarCanvas();

    let raspando = false;

    function raspar(e) {

        if (!raspando) return;

        const rect = canvas.getBoundingClientRect();

        let x, y;

        if (e.touches) {

            x = e.touches[0].clientX - rect.left;
            y = e.touches[0].clientY - rect.top;

        } else {

            x = e.clientX - rect.left;
            y = e.clientY - rect.top;
        }

        ctx.globalCompositeOperation = "destination-out";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            25,
            0,
            Math.PI * 2
        );

        ctx.fill();

        verificarAreaRaspada();
    }

    function iniciar(e) {

        raspando = true;
        raspar(e);
    }

    function parar() {

        raspando = false;
    }

    canvas.addEventListener("mousedown", iniciar);
    canvas.addEventListener("mousemove", raspar);
    canvas.addEventListener("mouseup", parar);
    canvas.addEventListener("mouseleave", parar);

    canvas.addEventListener("touchstart", iniciar, {
        passive: true
    });

    canvas.addEventListener("touchmove", raspar, {
        passive: true
    });

    canvas.addEventListener("touchend", parar);

    function verificarAreaRaspada() {

        /*
        Verifica quanto do canvas foi raspado.
        */

        const largura = canvas.width;
        const altura = canvas.height;

        const dados = ctx.getImageData(
            0,
            0,
            largura,
            altura
        ).data;

        let transparentes = 0;

        for (let i = 3; i < dados.length; i += 4) {

            if (dados[i] < 80) {
                transparentes++;
            }
        }

        const porcentagem =
            transparentes / (dados.length / 4);

        /*
        Quando aproximadamente 35% estiver raspado,
        consideramos aquele quadrinho descoberto.
        */

        if (
            porcentagem > 0.35 &&
            !cards[index].raspado
        ) {

            cards[index].raspado = true;
            raspados++;

            canvas.style.transition =
                "opacity .5s ease";

            canvas.style.opacity = "0";

            verificarVitoria();
        }
    }
}


/*
====================================================
VERIFICAR VITÓRIA
====================================================
*/

function verificarVitoria() {

    if (revelado) return;

    /*
    Confirma que os 3 quadrinhos rosas
    foram raspados.
    */

    const ganhou = vencedoras.every(
        posicao => cards[posicao].raspado
    );

    if (ganhou) {

        revelado = true;

        setTimeout(() => {

            reveal.classList.add("show");

            criarConfetes();

            reveal.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        }, 700);
    }
}


/*
====================================================
CONFETES DA REVELAÇÃO
====================================================
*/

function criarConfetes() {

    const simbolosConfete = [
        "🩷",
        "🎀",
        "✨",
        "💕",
        "🌸"
    ];

    for (let i = 0; i < 45; i++) {

        const confete =
            document.createElement("div");

        confete.className = "confetti";

        confete.textContent =
            simbolosConfete[
                Math.floor(
                    Math.random() *
                    simbolosConfete.length
                )
            ];

        confete.style.left =
            Math.random() * 100 + "vw";

        confete.style.fontSize =
            (Math.random() * 14 + 12) + "px";

        confete.style.animationDuration =
            (Math.random() * 3 + 3) + "s";

        confete.style.animationDelay =
            Math.random() * 1.5 + "s";

        document.body.appendChild(confete);

        setTimeout(() => {
            confete.remove();
        }, 6000);
    }
}

</script>

</body>
</html>
