<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Nossa Família está crescendo</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: linear-gradient(180deg, #f8eeee, #f2e3e3);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

.card {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    padding: 42px 20px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

.title {
    margin-top: 10px;
    color: #76645e;
    font-size: 25px;
    line-height: 1.25;
    font-weight: normal;
}

.subtitle {
    margin: 12px auto 25px;
    max-width: 370px;
    color: #927e77;
    font-size: 17px;
    line-height: 1.5;
}

.board {
    width: min(92vw, 390px);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 8px;
}

.cell {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    background: #fff9f7;
    box-shadow:
        0 5px 12px rgba(100, 70, 60, 0.15),
        inset 0 0 0 2px rgba(255,255,255,.8);
}

.result {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    border-radius: 50%;
    background: linear-gradient(145deg, #fffaf8, #f4dddd);
}

.symbol {
    font-size: 42px;
    line-height: 1;
    margin-bottom: 7px;
}

.label {
    font-size: 11px;
    color: #a08a83;
    letter-spacing: 1px;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: pointer;
}

.final {
    display: none;
    margin-top: 27px;
    animation: aparecer .9s ease;
}

.final.show {
    display: block;
}

.final h2 {
    margin: 0;
    color: #8d6d67;
    font-size: 29px;
    font-weight: normal;
}

.final p {
    margin: 8px auto 0;
    max-width: 340px;
    color: #9a817b;
    font-size: 16px;
    line-height: 1.4;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.95);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@media (max-height: 700px) {

    .card {
        padding-top: 22px;
    }

    .title {
        font-size: 22px;
    }

    .subtitle {
        margin-bottom: 14px;
        font-size: 15px;
    }

    .board {
        gap: 10px;
    }

    .symbol {
        font-size: 34px;
    }

    .final {
        margin-top: 15px;
    }
}
</style>
</head>

<body>

<main class="card">

    <div class="title">
        Nossa família está crescendo
    </div>

    <div class="subtitle">
        e queremos compartilhar com você<br>
        se virá <strong>Mateus ou Alice</strong>...
    </div>

    <div class="board" id="board"></div>

    <div class="final" id="final">
        <h2>É ALICE! 🩷</h2>
        <p>
            Uma princesinha está chegando
            para completar nossa família. ✨
        </p>
    </div>

</main>

<script>

const board = document.getElementById("board");
const final = document.getElementById("final");

/*
    POSIÇÕES:

       1     2     3
       4     5     6
       7     8     9

    A SEQUÊNCIA VENCEDORA É:

       🩵    🩷    🩵
       🩵    🩷    🩵
       🩷    🩷    🩵

    Portanto:
    2 + 5 + 8 = MENINA
*/

// 0 = menino
// 1 = menina

const resultados = [
    "🩵",  // 1
    "🩷",  // 2  ← VENCEDOR
    "🩵",  // 3

    "🩵",  // 4
    "🩷",  // 5  ← VENCEDOR
    "🩵",  // 6

    "🩷",  // 7
    "🩷",  // 8  ← VENCEDOR
    "🩵"   // 9
];

const vencedores = [1, 4, 7];

let revelados = [];

resultados.forEach((simbolo, index) => {

    const cell = document.createElement("div");
    cell.className = "cell";

    const result = document.createElement("div");
    result.className = "result";

    result.innerHTML = `
        <div class="symbol">${simbolo}</div>
        <div class="label">SURPRESA</div>
    `;

    cell.appendChild(result);

    const canvas = document.createElement("canvas");
    cell.appendChild(canvas);

    board.appendChild(cell);

    const ctx = canvas.getContext("2d");

    let desenhando = false;
    let concluido = false;

    function ajustarCanvas() {

        const tamanho = cell.getBoundingClientRect().width;
        const dpr = window.devicePixelRatio || 1;

        canvas.width = tamanho * dpr;
        canvas.height = tamanho * dpr;

        canvas.style.width = tamanho + "px";
        canvas.style.height = tamanho + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const gradiente = ctx.createLinearGradient(
            0,
            0,
            tamanho,
            tamanho
        );

        gradiente.addColorStop(0, "#f4d77a");
        gradiente.addColorStop(.35, "#c99b28");
        gradiente.addColorStop(.65, "#e8c75d");
        gradiente.addColorStop(1, "#a97b13");

        ctx.fillStyle = gradiente;

        ctx.beginPath();

        ctx.arc(
            tamanho / 2,
            tamanho / 2,
            tamanho / 2,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.globalCompositeOperation = "source-over";

        ctx.fillStyle = "rgba(255,255,255,.28)";
        ctx.font = "bold 13px Georgia";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
            "RASPE",
            tamanho / 2,
            tamanho / 2
        );
    }

    function raspar(e) {

        e.preventDefault();

        const rect = canvas.getBoundingClientRect();

        let x;
        let y;

        if (e.touches && e.touches.length) {

            x = e.touches[0].clientX - rect.left;
            y = e.touches[0].clientY - rect.top;

        } else {

            x = e.clientX - rect.left;
            y = e.clientY - rect.top;
        }

        ctx.globalCompositeOperation = "destination-out";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            22,
            0,
            Math.PI * 2
        );

        ctx.fill();

        verificarRaspagem();
    }

    function verificarRaspagem() {

        if (concluido) return;

        const largura = canvas.width;
        const altura = canvas.height;

        const dados = ctx.getImageData(
            0,
            0,
            largura,
            altura
        ).data;

        let transparentes = 0;

        for (
            let i = 3;
            i < dados.length;
            i += 4
        ) {

            if (dados[i] < 80) {
                transparentes++;
            }
        }

        const porcentagem =
            transparentes / (dados.length / 4);

        /*
            Consideramos o círculo raspado
            quando aproximadamente 35% foi removido.
        */

        if (porcentagem > 0.35) {

            concluido = true;

            canvas.style.pointerEvents = "none";

            if (!revelados.includes(index)) {
                revelados.push(index);
            }

            verificarSequencia();
        }
    }

    function verificarSequencia() {

        /*
            Só interessa saber se os círculos
            2, 5 e 8 foram revelados.

            No código os índices são:
            1, 4 e 7
        */

        const ganhou = vencedores.every(
            posicao => revelados.includes(posicao)
        );

        if (ganhou) {

            setTimeout(() => {

                final.classList.add("show");

            }, 500);
        }
    }

    // MOUSE

    canvas.addEventListener(
        "mousedown",
        (e) => {

            desenhando = true;
            raspar(e);

        }
    );

    canvas.addEventListener(
        "mousemove",
        (e) => {

            if (desenhando) {
                raspar(e);
            }

        }
    );

    window.addEventListener(
        "mouseup",
        () => {

            desenhando = false;

        }
    );

    // CELULAR

    canvas.addEventListener(
        "touchstart",
        (e) => {

            desenhando = true;
            raspar(e);

        },
        { passive: false }
    );

    canvas.addEventListener(
        "touchmove",
        (e) => {

            if (desenhando) {
                raspar(e);
            }

        },
        { passive: false }
    );

    canvas.addEventListener(
        "touchend",
        () => {

            desenhando = false;

        }
    );

    setTimeout(
        ajustarCanvas,
        100
    );

    window.addEventListener(
        "resize",
        ajustarCanvas
    );

});

</script>

</body>
</html>
