<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raspadinha - Mateus ou Alice</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: #f6eeee; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: Georgia, serif; }
        .card { width: min(100%, 520px); height: 100vh; max-height: 900px; position: relative; background-image: url('fundo.png.png'); background-size: 100% 100%; background-position: center; background-repeat: no-repeat; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 12%; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 14px; width: 100%; max-width: 390px; margin: 0 auto; padding: 0 25px; }
        .cell { aspect-ratio: 1; position: relative; user-select: none; -webkit-user-select: none; touch-action: none; display: flex; justify-content: center; align-items: center; background-size: 65%; background-position: center; background-repeat: no-repeat; }
        .canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; touch-action: none; cursor: pointer; }
    </style>
</head>
<body>
    <main class="card">
        <div class="board" id="board"></div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const board = document.getElementById('board');
            const premios = ['mateus', 'alice', 'mateus', 'alice', 'mateus', 'alice', 'mateus', 'alice', 'mateus'];
            
            const imagensResultado = {
                mateus: 'https://icons8.com', 
                alice: 'https://icons8.com'    
            };

            premios.forEach(premio => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.style.backgroundImage = url('${imagensResultado[premio]}');
                
                const canvas = document.createElement('canvas');
                canvas.className = 'canvas';
                cell.appendChild(canvas);
                board.appendChild(cell);

                const ctx = canvas.getContext('2d');
                
                function initCanvas() {
                    const size = canvas.offsetWidth || 110;
                    canvas.width = size;
                    canvas.height = size;
                    
                    const gradient = ctx.createLinearGradient(0, 0, size, size);
                    gradient.addColorStop(0, '#e5c158');
                    gradient.addColorStop(0.5, '#b8860b');
                    gradient.addColorStop(1, '#f3e195');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(size/2, size/2, size/2, 0, Math.PI * 2);
                    ctx.fill();
                }

                function scratch(e) {
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    const x = clientX - rect.left;
                    const y = clientY - rect.top;

                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.beginPath();
                    ctx.arc(x, y, 25, 0, Math.PI * 2);
                    ctx.fill();
                }

                canvas.addEventListener('mousemove', (e) => { if(e.buttons === 1) scratch(e); });
                canvas.addEventListener('touchstart', (e) => { scratch(e); });
                canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    scratch(e);
                }, { passive: false });
                
                setTimeout(initCanvas, 300);
                window.addEventListener('resize', initCanvas);
            });
        });
    </script>
</body>
</html>
